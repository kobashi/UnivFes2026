<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Room Admin</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 14px "Hiragino Sans", sans-serif; }
  main { padding: 16px; max-width: 1100px; margin: auto; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #aaa; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #383838; }
  button.on { background: #2b6; border-color: #4d8; color: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #now { font-size: 20px; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; }
  td, th { padding: 4px 10px; border-bottom: 1px solid #2a2a2a; text-align: left; }
  tr.cur td { color: #6f9; }
  #map { display: flex; flex-direction: column; gap: 3px; }
  .row { display: grid; grid-template-columns: 60px repeat(10, 1fr); gap: 3px; }
  .row > b { font-weight: normal; color: #888; align-self: center; }
  .aisle { color: #555; text-align: center; font-size: 12px; letter-spacing: .3em; padding: 4px 0 4px 60px; }
  .seat { background: #3a1d1d; border-radius: 4px; padding: 4px; font-size: 11px; min-height: 44px; line-height: 1.3; overflow: hidden; }
  .seat.online { background: #173a25; }
  .seat.warn { background: #3a341a; }
  .seat strong { font-size: 13px; }
  #unassigned { color: #fa6; }
  #geo input[type=number] { width: 64px; background: #1c1c1c; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px; font: inherit; }
  #geo table td { padding: 2px 3px; border: none; }
  #geo .note { color: #999; font-size: 12px; margin: 6px 0; }
  #preview { width: 100%; height: 190px; background: #000; border-radius: 6px; margin-top: 8px; }
  #dirty { color: #fa6; }
</style>
</head>
<body>
<main>
  <h1>PC実習室アトラクション 管理画面 <a href="/sim" style="font-size:13px;color:#8cf">シミュレータ</a></h1>
  <div id="now">…</div>

  <h2>進行</h2>
  <div class="bar">
    <button data-act="next">次の演目へ</button>
    <button data-act="restart">最初からループ</button>
    <button data-act="release">固定を解除</button>
    <button id="mute">ミュート</button>
    <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05"></label>
    <button id="identify">座席番号表示</button>
    <button id="calibrate">間隔チェック表示</button>
    <button data-act="reload">全台リロード</button>
  </div>
  <table id="scenes"></table>

  <h2>端末 <span id="count"></span></h2>
  <div id="map"></div>
  <p id="unassigned"></p>

  <h2>端末の間隔</h2>
  <div id="geo">
    <p class="note">画面（表示部分）の中心の位置を、全列共通の基準端（各列の1番がある側の端）から cm で入力します。空欄の台は、隣と隙間なく並んでいるものとして扱います。
      保存すると全台にすぐ反映されます。「間隔チェック表示」を出すと、正しく設定できていれば斜線が隣の画面とまっすぐつながって見えます。</p>
    <div class="bar">
      <label>画面の横幅 <input id="gw" type="number" min="10" max="200" step="0.1"> cm</label>
      <label>隙間の再現 <input id="gs" type="range" min="0" max="1" step="0.05"> <span id="gsv"></span></label>
      <label>通路Aから列1を見たとき 1番は <select id="gside"><option value="left">左端</option><option value="right">右端</option></select></label>
    </div>
    <p class="note">「間隔チェック表示」では各画面に「10番側 →」の矢印が出ます。矢印が実際に番号の大きい隣の台を指していなければ、「1番は」の左右を切り替えて保存してください（全列まとめて切り替わります）。</p>
    <div class="bar" style="margin-top:6px">
      等間隔で埋める：
      <select id="fr"><option value="all">全列</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      <label>1番の中心 <input id="fs" type="number" step="0.5"> cm</label>
      <label>間隔 <input id="fp" type="number" step="0.5"> cm</label>
      <button id="fill">埋める</button>
    </div>
    <table id="gt"></table>
    <canvas id="preview" width="1100" height="190"></canvas>
    <div class="bar" style="margin-top:8px">
      <button id="gsave">保存して全台に反映</button>
      <button id="greset">保存済みの値に戻す</button>
      <span id="dirty"></span>
    </div>
  </div>
</main>
<script type="module">
  import { sceneAt } from '/js/schedule.js';
  import { SCENES } from '/js/scenes/index.js';
  import { allSeats } from '/js/layout.js';

  const token = new URLSearchParams(location.search).get('token') ?? '';
  let data = null;

  async function act(action, extra = {}) {
    const r = await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
      body: JSON.stringify({ action, ...extra }),
    });
    if (!r.ok) alert(`失敗: ${(await r.json()).error}`);
    refresh();
  }

  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.act === 'reload' && !confirm('全端末をリロードしますか？')) return;
    act(b.dataset.act);
  }));
  document.getElementById('mute').onclick = () => act('mute', { on: !data.state.muted });
  document.getElementById('identify').onclick = () => act('identify', { on: !data.state.identify });
  document.getElementById('calibrate').onclick = () => act('calibrate', { on: !data.state.calibrate });
  document.getElementById('vol').onchange = (e) => act('volume', { value: +e.target.value });

  async function refresh() {
    try {
      data = await (await fetch('/api/clients', { cache: 'no-store' })).json();
      data.fetchedAt = performance.now();
      render();
    } catch {
      document.getElementById('now').textContent = 'サーバに接続できません';
    }
  }

  function render() {
    const { state, seats, unassigned } = data;
    const sch = state.schedule;
    document.getElementById('mute').classList.toggle('on', state.muted);
    document.getElementById('identify').classList.toggle('on', state.identify);
    document.getElementById('calibrate').classList.toggle('on', state.calibrate);
    if (!geoBuilt) buildGeo(data.layout);
    const vol = document.getElementById('vol');
    if (document.activeElement !== vol) vol.value = state.volume;

    const cur = sceneAt(sch, data.now);
    document.getElementById('scenes').innerHTML = sch.scenes.map((s, i) => `
      <tr class="${i === cur.index ? 'cur' : ''}">
        <td>${i + 1}</td><td>${SCENES[s.id]?.title ?? s.id}</td><td>${s.id}</td><td>${s.duration}秒</td>
        <td><button data-jump="${i}">ここへ</button> <button data-hold="${i}">固定</button></td>
      </tr>`).join('');
    document.querySelectorAll('[data-jump]').forEach((b) => (b.onclick = () => act('jump', { index: +b.dataset.jump })));
    document.querySelectorAll('[data-hold]').forEach((b) => (b.onclick = () => act('hold', { index: +b.dataset.hold })));

    const rows = { 1: [], 2: [], 3: [], 4: [] };
    for (const s of seats) (rows[s.row] ??= []).push(s);
    const cell = (s) => {
      const st = s.status;
      const warn = st && (st.audio !== 'running' || !String(st.camera).startsWith('ok') || st.fps < 20);
      return `<div class="seat ${s.online ? (warn ? 'warn' : 'online') : ''}" title="${st ? JSON.stringify(st).replaceAll('"', '&quot;') : 'no data'}">
        <strong>${s.id}</strong><br>${st ? `${st.ip}<br>${st.fps}fps ${st.audio === 'running' ? '♪' : '🔇'} ${String(st.camera).startsWith('ok') ? '📷' : '—'}` : '未接続'}</div>`;
    };
    const row = (r) => `<div class="row"><b>列${r}</b>${rows[r].sort((a, b) => a.x - b.x).map(cell).join('')}</div>`;
    document.getElementById('map').innerHTML =
      `<div class="aisle">通路A（壁側）</div>${row(1)}${row(2)}<div class="aisle">中央通路</div>${row(3)}${row(4)}<div class="aisle">通路C（壁側）</div>`;
    document.getElementById('count').textContent = `${seats.filter((s) => s.online).length} / ${seats.length} 台オンライン（黄 = 音声/カメラ/fps に注意）`;
    document.getElementById('unassigned').textContent = unassigned.length
      ? `座席未割当の端末: ${unassigned.map((u) => u.ip).join(', ')}` : '';
  }

  // ---------- 端末の間隔 ----------
  let geoBuilt = false;
  let geoLayout = null;
  const $ = (id) => document.getElementById(id);

  function buildGeo(layout) {
    geoBuilt = true;
    geoLayout = layout;
    const g = layout.geometry;
    $('gw').value = g.screenWidthCm;
    $('gs').value = g.gapScale;
    $('gside').value = g.col1Side ?? 'left';
    let html = '<tr><td></td>' + Array.from({ length: layout.perRow }, (_, i) => `<td>${i + 1}番</td>`).join('') + '</tr>';
    for (let r = 1; r <= layout.rows; r++) {
      html += `<tr><td>列${r}</td>`;
      for (let c = 1; c <= layout.perRow; c++) {
        const v = g.positionsCm?.[r]?.[c - 1];
        html += `<td><input type="number" step="0.5" data-r="${r}" data-c="${c}" value="${v ?? ''}"></td>`;
      }
      html += '</tr>';
    }
    $('gt').innerHTML = html;
    $('dirty').textContent = '';
    drawPreview();
  }

  function readGeo() {
    const positionsCm = {};
    document.querySelectorAll('#gt input').forEach((el) => {
      const r = el.dataset.r;
      (positionsCm[r] ??= Array(geoLayout.perRow).fill(null))[el.dataset.c - 1] = el.value === '' ? null : +el.value;
    });
    return { screenWidthCm: +$('gw').value, gapScale: +$('gs').value, positionsCm, col1Side: $('gside').value };
  }

  function drawPreview() {
    const geometry = readGeo();
    $('gsv').textContent = `${Math.round(geometry.gapScale * 100)}%`;
    const seats = allSeats({ ...geoLayout, geometry });
    const cv = $('preview');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    const minX = Math.min(...seats.map((s) => s.x)) - 0.5;
    const maxX = Math.max(...seats.map((s) => s.x)) + 0.5;
    const sc = (cv.width - 80) / (maxX - minX);
    const rowY = { 1: 18, 2: 52, 3: 112, 4: 146 };
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#666';
    ctx.fillText('中央通路', 80 + ((maxX - minX) * sc) / 2 - 24, 100);
    for (const s of seats) {
      const x = 70 + (s.x - 0.5 - minX) * sc;
      const y = rowY[s.row] ?? 0;
      ctx.fillStyle = s.aisle === 1 ? '#2b6' : '#279';
      ctx.fillRect(x, y, sc - 1, 26);
      ctx.fillStyle = '#000';
      if (sc > 22) ctx.fillText(s.col, x + 3, y + 17);
      if (s.col === 1) {
        ctx.fillStyle = '#999';
        ctx.fillText(`列${s.row}`, 4, y + 17);
      }
    }
  }

  $('geo').addEventListener('input', () => {
    $('dirty').textContent = '未保存の変更があります';
    drawPreview();
  });
  $('fill').onclick = () => {
    const start = +$('fs').value;
    const pitch = +$('fp').value;
    if (!pitch) return alert('間隔を入力してください');
    document.querySelectorAll('#gt input').forEach((el) => {
      if ($('fr').value === 'all' || $('fr').value === el.dataset.r) el.value = start + pitch * (el.dataset.c - 1);
    });
    $('geo').dispatchEvent(new Event('input'));
  };
  $('gsave').onclick = async () => {
    const r = await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
      body: JSON.stringify({ action: 'geometry', geometry: readGeo() }),
    });
    const j = await r.json();
    if (!r.ok) return alert(`失敗: ${j.error}`);
    buildGeo(j.layout);
    $('dirty').textContent = '保存しました';
  };
  $('greset').onclick = async () => {
    const j = await (await fetch('/api/clients', { cache: 'no-store' })).json();
    buildGeo(j.layout);
  };

  // 残り時間はローカルで毎秒進める
  setInterval(() => {
    if (!data) return;
    const now = data.now + (performance.now() - data.fetchedAt);
    const i = sceneAt(data.state.schedule, now);
    const title = SCENES[i.id]?.title ?? i.id;
    document.getElementById('now').textContent =
      `上演中: ${title}  残り ${Math.ceil(i.remaining)} 秒${data.state.schedule.hold != null ? '（固定中）' : ''}`;
  }, 250);

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
